<script>
const params = new URLSearchParams(location.search);
const post = getPostPorId(params.get('id'));
const container = document.getElementById('post-container');

if (!post) {
  container.innerHTML = `
    <div class="center">
      <h2>Artigo não encontrado</h2>
      <a class="btn btn-secondary" href="blog.html">Voltar para o blog</a>
    </div>`;
} else {
  document.title = `${post.titulo} — Rocha Costa`;
  container.innerHTML = `
    <div class="breadcrumb" style="margin-bottom:16px;"><a href="index.html">Início</a> / <a href="blog.html">Blog</a> / ${post.titulo}</div>
    <span class="tag">${post.categoria}</span>
    <h1>${post.titulo}</h1>
    <p class="meta">${new Date(post.data).toLocaleDateString('pt-BR')}</p>
    <img src="${post.imagem}" alt="${post.titulo}" style="border-radius:24px;box-shadow:var(--shadow);margin:20px 0;">
    ${post.corpo.split('\n').map((par) => `<p>${par.trim()}</p>`).join('')}
    <div class="hero-card" style="background:var(--off-white);border:1px solid var(--gray-100);margin-top:30px;">
      <h3 class="mt-0">Quer saber mais sobre nossos imóveis?</h3>
      <div class="hero-actions">
        <a href="imoveis.html" class="btn btn-secondary">Ver imóveis</a>
        <a href="#" class="btn btn-whatsapp" data-wa><svg class="icon" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" fill="currentColor"><path fill-rule="evenodd" d="M43.75 18.35 C28.02 19.25 19.76 21.87 14.05 27.78 C10.58 31.38 8.64 35.95 8.42 41.08 C8.00 50.82 13.74 59.10 23.56 62.95 C24.18 63.19 24.68 63.44 24.68 63.53 C24.68 63.61 23.54 67.08 22.15 71.25 C20.76 75.42 19.62 78.98 19.62 79.18 C19.64 79.93 20.34 80.62 21.08 80.62 C21.69 80.62 19.88 81.99 39.20 67.00 L40.06 66.34 L42.01 66.50 C44.60 66.71 53.59 66.71 56.07 66.50 C70.70 65.25 77.57 62.87 83.36 57.07 C92.00 48.42 91.43 33.84 82.16 26.11 C77.85 22.52 72.30 20.34 64.66 19.24 C58.88 18.39 49.77 18.01 43.75 18.35 Z"/></svg> Falar no WhatsApp</a>
      </div>
    </div>`;
  ligarBotoesWhatsApp(container);
}
</script>
